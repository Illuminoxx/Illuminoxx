<svg width="900" height="280" viewBox="0 0 900 280" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#0d1b2e"/>
      <stop offset="100%" stop-color="#050d1a"/>
    </radialGradient>

    <!-- particle dots -->
    <circle id="p" r="1.5" fill="#38bdf8" opacity="0.6"/>

    <style>
      .name { font-family: 'Segoe UI', Arial, sans-serif; font-weight: 700; font-size: 42px; fill: #f0f6fc; letter-spacing: -1px; }
      .sub  { font-family: 'Courier New', monospace; font-size: 14px; fill: #38bdf8; letter-spacing: 2px; }
      .pill { font-family: 'Segoe UI', Arial, sans-serif; font-size: 11px; font-weight: 600; letter-spacing: 0.5px; }

      /* grid lines fade */
      .gl { stroke: #38bdf8; stroke-width: 0.4; opacity: 0; animation: gridpulse 4s ease-in-out infinite; }
      .gl:nth-child(2) { animation-delay: 0.3s; }
      .gl:nth-child(3) { animation-delay: 0.6s; }
      .gl:nth-child(4) { animation-delay: 0.9s; }
      .gl:nth-child(5) { animation-delay: 1.2s; }
      .gl:nth-child(6) { animation-delay: 1.5s; }
      .gl:nth-child(7) { animation-delay: 1.8s; }
      .gl:nth-child(8) { animation-delay: 2.1s; }
      @keyframes gridpulse { 0%,100%{opacity:0} 50%{opacity:0.12} }

      /* floating particles */
      .pt { animation: float linear infinite; }
      @keyframes float {
        0%   { transform: translateY(0px)   translateX(0px);   opacity: 0; }
        10%  { opacity: 0.7; }
        90%  { opacity: 0.5; }
        100% { transform: translateY(-220px) translateX(30px); opacity: 0; }
      }

      /* scan line */
      .scan { animation: scanning 5s linear infinite; }
      @keyframes scanning { 0%{transform:translateY(-10px);opacity:0} 5%{opacity:1} 95%{opacity:0.6} 100%{transform:translateY(290px);opacity:0} }

      /* name glow pulse */
      .name { animation: namepulse 3s ease-in-out infinite; }
      @keyframes namepulse { 0%,100%{fill:#f0f6fc} 50%{fill:#ffffff} }

      /* accent line grow */
      .acline { stroke-dasharray: 300; stroke-dashoffset: 300; animation: linegrow 2s ease forwards; animation-delay: 0.5s; }
      @keyframes linegrow { to { stroke-dashoffset: 0; } }

      /* badge float */
      .bdg { animation: bdgfloat 4s ease-in-out infinite; }
      .bdg:nth-child(2) { animation-delay: 0.8s; }
      .bdg:nth-child(3) { animation-delay: 1.6s; }
      .bdg:nth-child(4) { animation-delay: 2.4s; }
      @keyframes bdgfloat { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-4px)} }

      /* corner brackets blink */
      .brk { animation: brkpulse 2.5s ease-in-out infinite; }
      @keyframes brkpulse { 0%,100%{opacity:0.3} 50%{opacity:1} }

      /* data streams */
      .ds { animation: stream 6s linear infinite; opacity: 0; }
      @keyframes stream { 0%{opacity:0;transform:translateX(-20px)} 10%{opacity:0.4} 90%{opacity:0.2} 100%{opacity:0;transform:translateX(920px)} }
    </style>
  </defs>

  <!-- background -->
  <rect width="900" height="280" fill="url(#bg)"/>

  <!-- subtle dot grid -->
  <g opacity="0.18">
    <line class="gl" x1="150" y1="0" x2="150" y2="280"/>
    <line class="gl" x1="300" y1="0" x2="300" y2="280"/>
    <line class="gl" x1="450" y1="0" x2="450" y2="280"/>
    <line class="gl" x1="600" y1="0" x2="600" y2="280"/>
    <line class="gl" x1="750" y1="0" x2="750" y2="280"/>
    <line class="gl" x1="0" y1="70"  x2="900" y2="70"/>
    <line class="gl" x1="0" y1="140" x2="900" y2="140"/>
    <line class="gl" x1="0" y1="210" x2="900" y2="210"/>
  </g>

  <!-- scan line -->
  <rect class="scan" x="0" y="0" width="900" height="1.5" fill="#38bdf8" opacity="0.3"/>

  <!-- data stream lines (background flavor) -->
  <text class="ds" x="0" y="30"  font-family="Courier New" font-size="9" fill="#38bdf8" opacity="0.15" style="animation-delay:0s">01001101 00110000 01000100</text>
  <text class="ds" x="0" y="260" font-family="Courier New" font-size="9" fill="#38bdf8" opacity="0.15" style="animation-delay:2s">11001010 01110010 00110001</text>
  <text class="ds" x="0" y="250" font-family="Courier New" font-size="9" fill="#4ade80" opacity="0.1" style="animation-delay:4s">import sentimentedge as se</text>

  <!-- floating particles -->
  <circle class="pt" cx="80"  cy="260" r="1.5" fill="#38bdf8" opacity="0.6" style="animation-duration:7s;animation-delay:0s"/>
  <circle class="pt" cx="160" cy="280" r="1"   fill="#4ade80" opacity="0.5" style="animation-duration:9s;animation-delay:1s"/>
  <circle class="pt" cx="240" cy="270" r="2"   fill="#38bdf8" opacity="0.4" style="animation-duration:6s;animation-delay:2s"/>
  <circle class="pt" cx="380" cy="280" r="1.5" fill="#c084fc" opacity="0.5" style="animation-duration:8s;animation-delay:0.5s"/>
  <circle class="pt" cx="520" cy="275" r="1"   fill="#38bdf8" opacity="0.6" style="animation-duration:7.5s;animation-delay:1.5s"/>
  <circle class="pt" cx="640" cy="280" r="2"   fill="#4ade80" opacity="0.4" style="animation-duration:6.5s;animation-delay:3s"/>
  <circle class="pt" cx="750" cy="270" r="1.5" fill="#38bdf8" opacity="0.5" style="animation-duration:9s;animation-delay:0.8s"/>
  <circle class="pt" cx="830" cy="280" r="1"   fill="#c084fc" opacity="0.4" style="animation-duration:8s;animation-delay:2.2s"/>
  <circle class="pt" cx="44"  cy="280" r="1.5" fill="#4ade80" opacity="0.3" style="animation-duration:10s;animation-delay:4s"/>
  <circle class="pt" cx="860" cy="275" r="1"   fill="#38bdf8" opacity="0.5" style="animation-duration:7s;animation-delay:3.5s"/>

  <!-- corner brackets -->
  <g class="brk" stroke="#38bdf8" stroke-width="2" fill="none">
    <path d="M20,20 L20,8 L32,8"/>
    <path d="M880,8 L892,8 L892,20"/>
    <path d="M20,260 L20,272 L32,272"/>
    <path d="M880,272 L892,272 L892,260"/>
  </g>

  <!-- accent line -->
  <line class="acline" x1="300" y1="155" x2="600" y2="155" stroke="#38bdf8" stroke-width="1" opacity="0.5"/>

  <!-- main name -->
  <text class="name" x="450" y="115" text-anchor="middle">Prashant Singh</text>

  <!-- sub tagline -->
  <text class="sub" x="450" y="145" text-anchor="middle">// CS STUDENT · ML ENGINEER · CP</text>

  <!-- badges row -->
  <g class="bdg">
    <rect x="168" y="175" width="100" height="22" rx="11" fill="#0f3d2e" stroke="#4ade80" stroke-width="0.8"/>
    <text class="pill" x="218" y="190" text-anchor="middle" fill="#4ade80">Open to Work</text>
  </g>
  <g class="bdg">
    <rect x="280" y="175" width="120" height="22" rx="11" fill="#0c2a3d" stroke="#38bdf8" stroke-width="0.8"/>
    <text class="pill" x="340" y="190" text-anchor="middle" fill="#38bdf8">Backend · AI/ML</text>
  </g>
  <g class="bdg">
    <rect x="412" y="175" width="108" height="22" rx="11" fill="#1e1040" stroke="#c084fc" stroke-width="0.8"/>
    <text class="pill" x="466" y="190" text-anchor="middle" fill="#c084fc">Top 19% LeetCode</text>
  </g>
  <g class="bdg">
    <rect x="532" y="175" width="108" height="22" rx="11" fill="#0f3d2e" stroke="#4ade80" stroke-width="0.8"/>
    <text class="pill" x="586" y="190" text-anchor="middle" fill="#4ade80">250+ DSA Solved</text>
  </g>

  <!-- bottom status bar -->
  <rect x="0" y="260" width="900" height="20" fill="#050d1a" opacity="0.7"/>
  <circle cx="20" cy="270" r="4" fill="#4ade80">
    <animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text font-family="Courier New" font-size="9" fill="#4ade80" x="30" y="274">AVAILABLE FOR HIRE</text>
  <text font-family="Courier New" font-size="9" fill="#38bdf8" x="460" y="274" text-anchor="middle">github.com/Illuminoxx</text>
  <text font-family="Courier New" font-size="9" fill="#8b949e" x="870" y="274" text-anchor="end">2025</text>
</svg>
