<svg width="100%" viewBox="0 0 900 280" xmlns="http://www.w3.org/2000/svg" role="img">
  <title>Prashant Singh — GitHub Profile Banner</title>
  <desc>Animated GitHub banner for Prashant Singh, CS Student, ML Engineer, CP</desc>

  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#020c1b"/>
      <stop offset="100%" stop-color="#0a1628"/>
    </linearGradient>
    <linearGradient id="scanGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0"/>
      <stop offset="40%" stop-color="#00d4ff" stop-opacity="0.9"/>
      <stop offset="60%" stop-color="#00d4ff" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#00d4ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ruleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00d4ff" stop-opacity="0"/>
      <stop offset="25%" stop-color="#00d4ff" stop-opacity="1"/>
      <stop offset="75%" stop-color="#00d4ff" stop-opacity="1"/>
      <stop offset="100%" stop-color="#00d4ff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="nameGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#0066ff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#020c1b" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="softGlow">
      <feGaussianBlur stdDeviation="1.5" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="clip">
      <rect width="900" height="280" rx="12"/>
    </clipPath>
  </defs>

  <style>
    @keyframes nameIn   { from{opacity:0;transform:translateY(16px)} to{opacity:1;transform:translateY(0)} }
    @keyframes tagIn    { from{opacity:0;letter-spacing:12px} to{opacity:1;letter-spacing:5px} }
    @keyframes pillIn   { from{opacity:0;transform:scale(0.75)} to{opacity:1;transform:scale(1)} }
    @keyframes scan     { 0%{transform:translateX(-220px);opacity:0} 8%{opacity:1} 92%{opacity:1} 100%{transform:translateX(920px);opacity:0} }
    @keyframes ruleDraw { from{stroke-dashoffset:640} to{stroke-dashoffset:0} }
    @keyframes bDraw    { from{stroke-dashoffset:50} to{stroke-dashoffset:0} }
    @keyframes blink    { 0%,100%{opacity:1} 50%{opacity:0.25} }
    @keyframes float    { 0%,100%{transform:translate(0,0)} 50%{transform:translate(5px,-7px)} }
    @keyframes float2   { 0%,100%{transform:translate(0,0)} 50%{transform:translate(-6px,6px)} }
    @keyframes pulseC   { 0%,100%{stroke-opacity:.7;stroke-width:1.5} 50%{stroke-opacity:1;stroke-width:2} }
    @keyframes fadeUp   { from{opacity:0;transform:translateY(5px)} to{opacity:1;transform:translateY(0)} }
    @keyframes aura     { 0%,100%{opacity:.7} 50%{opacity:1} }

    .name     { animation: nameIn  1s cubic-bezier(.22,1,.36,1) .3s both }
    .tag      { animation: tagIn   1s ease-out .85s both }
    .pill1    { animation: pillIn  .55s cubic-bezier(.34,1.56,.64,1) 1.1s both }
    .pill2    { animation: pillIn  .55s cubic-bezier(.34,1.56,.64,1) 1.28s both }
    .pill3    { animation: pillIn  .55s cubic-bezier(.34,1.56,.64,1) 1.46s both }
    .scan     { animation: scan    3.8s ease-in-out .5s infinite }
    .rule     { stroke-dasharray:640; animation: ruleDraw 1s ease-out .95s both }
    .b1       { stroke-dasharray:50; animation: bDraw .7s ease-out .1s both }
    .b2       { stroke-dasharray:50; animation: bDraw .7s ease-out .2s both }
    .b3       { stroke-dasharray:50; animation: bDraw .7s ease-out .3s both }
    .b4       { stroke-dasharray:50; animation: bDraw .7s ease-out .4s both }
    .dot      { animation: blink   1.8s ease-in-out infinite }
    .p1       { animation: float   6s ease-in-out infinite }
    .p2       { animation: float2  7s ease-in-out 1s infinite }
    .p3       { animation: float   8s ease-in-out 2s infinite }
    .p4       { animation: float2  5.5s ease-in-out .5s infinite }
    .p5       { animation: float   7.5s ease-in-out 3s infinite }
    .p6       { animation: float2  6.5s ease-in-out 1.5s infinite }
    .pc1      { animation: pulseC  2.5s ease-in-out 2s infinite }
    .pc2      { animation: pulseC  2.5s ease-in-out 2.3s infinite }
    .pc3      { animation: pulseC  2.5s ease-in-out 2.6s infinite }
    .foot     { animation: fadeUp  .8s ease-out 1.9s both }
    .aura     { animation: aura    5s ease-in-out infinite }
  </style>

  <g clip-path="url(#clip)">
    <rect width="900" height="280" fill="url(#bg)"/>
    <ellipse class="aura" cx="450" cy="130" rx="310" ry="120" fill="url(#nameGlow)"/>
    <circle class="p1" cx="75" cy="68" r="2" fill="#00d4ff" opacity=".5"/>
    <circle class="p2" cx="118" cy="130" r="1.5" fill="#9b59ff" opacity=".6"/>
    <circle class="p3" cx="58" cy="195" r="2" fill="#00ff9d" opacity=".4"/>
    <circle class="p4" cx="822" cy="75" r="2" fill="#9b59ff" opacity=".5"/>
    <circle class="p5" cx="780" cy="155" r="1.5" fill="#00d4ff" opacity=".6"/>
    <circle class="p6" cx="838" cy="210" r="2" fill="#00ff9d" opacity=".4"/>
    <rect class="scan" x="0" y="119" width="220" height="2" fill="url(#scanGrad)"/>
    <line class="rule" x1="130" y1="122" x2="770" y2="122" stroke="url(#ruleGrad)" stroke-width="1.5"/>
    <polyline class="b1" points="16,42 16,18 40,18" fill="none" stroke="#00d4ff" stroke-width="2.5" stroke-linecap="round" filter="url(#softGlow)"/>
    <polyline class="b2" points="884,42 884,18 860,18" fill="none" stroke="#00d4ff" stroke-width="2.5" stroke-linecap="round" filter="url(#softGlow)"/>
    <polyline class="b3" points="16,238 16,262 40,262" fill="none" stroke="#00d4ff" stroke-width="2.5" stroke-linecap="round" filter="url(#softGlow)"/>
    <polyline class="b4" points="884,238 884,262 860,262" fill="none" stroke="#00d4ff" stroke-width="2.5" stroke-linecap="round" filter="url(#softGlow)"/>
    <text class="name" x="450" y="100" text-anchor="middle" font-family="'Segoe UI','SF Pro Display',system-ui,sans-serif" font-size="56" font-weight="700" letter-spacing="-1" fill="#ffffff" filter="url(#glow)">Prashant Singh</text>
    <text class="tag" x="450" y="148" text-anchor="middle" font-family="'Courier New',monospace" font-size="12" fill="#00d4ff" letter-spacing="15">CS Grad  ·  Developer  ·  Programmer</text>

    <g class="pill1">
      <rect class="pc1" x="190" y="172" width="160" height="34" rx="17" fill="#00d4ff08" stroke="#00d4ff" stroke-width="1.5"/>
      <text x="270" y="194" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="13" fill="#7ee8fa">Backend · AI/ML</text>
    </g>

    <g class="pill2">
      <rect class="pc2" x="370" y="172" width="160" height="34" rx="17" fill="#9b59ff08" stroke="#9b59ff" stroke-width="1.5"/>
      <text x="450" y="194" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="13" fill="#c8a8ff">Top 19% LeetCode</text>
    </g>

    <g class="pill3">
      <rect class="pc3" x="550" y="172" width="160" height="34" rx="17" fill="#00ff9d08" stroke="#00c896" stroke-width="1.5"/>
      <text x="630" y="194" text-anchor="middle" font-family="'Segoe UI',system-ui,sans-serif" font-size="13" fill="#7eebc8">400+ DSA Solved</text>
    </g>

    <line x1="0" y1="248" x2="900" y2="248" stroke="#9b59ff" stroke-width="0.5" opacity=".35"/>
    <circle class="dot foot" cx="58" cy="258" r="5" fill="#00c896"/>
    <text class="foot" x="70" y="262" font-family="'Courier New',monospace" font-size="10" fill="#00c896" letter-spacing="2">AVAILABLE FOR HIRE</text>
    <text class="foot" x="450" y="262" text-anchor="middle" font-family="'Courier New',monospace" font-size="10" fill="#4a7a9b" letter-spacing="1">github.com/Illuminoxx</text>
    <text class="foot" x="842" y="262" text-anchor="end" font-family="'Courier New',monospace" font-size="10" fill="#4a7a9b">2025</text>
  </g>
</svg>